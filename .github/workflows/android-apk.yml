name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: android
      - name: Verify APK
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee /tmp/projeto-all-apk-badging
          grep -F "package: name='com.fysould.projetoall'" /tmp/projeto-all-apk-badging
          grep -F "launchable-activity: name='com.fysould.projetoall.MainActivity'" /tmp/projeto-all-apk-badging
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: projeto-all-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
